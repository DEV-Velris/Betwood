services:
  database:
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: betwood
      POSTGRES_USER: betwood_user
      POSTGRES_PASSWORD: betwood_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready d $${POSTGRES_DB} || EXIT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s